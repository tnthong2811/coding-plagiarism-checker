name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 and cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run tests (Maven)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Upload build artifact - modules jars
        uses: actions/upload-artifact@v4
        with:
          name: modules-jars
          path: |
            auth/target/*.jar
            submission/target/*.jar
            analyzer/target/*.jar


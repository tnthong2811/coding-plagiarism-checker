name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Test and Docker images
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 and cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run tests (Maven)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      # Buildx setup for Docker image builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker registry (optional)
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Generate tags: commit SHA + latest
      - name: Generate Docker tags
        id: docker_tags
        run: |
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # Build and push images from root context (for multi-stage Dockerfile)
      - name: Build auth image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./auth/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/coding-plagiarism-checker/auth:latest
            ${{ secrets.DOCKER_REGISTRY }}/coding-plagiarism-checker/auth:${{ steps.docker_tags.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.created=${{ steps.docker_tags.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build submission image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./submission/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/coding-plagiarism-checker/submission:latest
            ${{ secrets.DOCKER_REGISTRY }}/coding-plagiarism-checker/submission:${{ steps.docker_tags.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.created=${{ steps.docker_tags.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build analyzer image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./analyzer/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/coding-plagiarism-checker/analyzer:latest
            ${{ secrets.DOCKER_REGISTRY }}/coding-plagiarism-checker/analyzer:${{ steps.docker_tags.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.created=${{ steps.docker_tags.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Upload build artifact - modules jars
        uses: actions/upload-artifact@v4
        with:
          name: modules-jars
          path: |
            auth/target/*.jar
            submission/target/*.jar
            analyzer/target/*.jar

